name: Windows Release Artifacts

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Windows SDK and linker
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Clang
        shell: bash
        run: |
          clang --version
          make -C src clean tea00.dll CC=clang OS=Windows_NT TARGET_SYS=Windows TARGET_XLIBS= 'TARGET_XSHLDFLAGS=-shared -Wl,/implib:tea00.lib'
          make -C src tea.exe CC=clang OS=Windows_NT TARGET_SYS=Windows TARGET_XLIBS= TARGET_O=tea00.lib 'TARGET_XSHLDFLAGS=-shared -Wl,/implib:tea00.lib'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teascript-windows
          path: |
            src/tea.exe
            src/tea00.dll
            src/script/
          if-no-files-found: error
